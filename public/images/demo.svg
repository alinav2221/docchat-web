  <text x="56" y="94" font-family="system-ui" font-size="10" fill="#64748b">42 pages · 2.4 MB</text>

  <!-- PDF page thumbnails -->
  <rect x="30" y="115" width="80" height="100" rx="4" fill="#ffffff" opacity="0.9"/>
  <rect x="38" y="125" width="50" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="38" y="132" width="60" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="38" y="139" width="45" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="38" y="149" width="55" height="3" rx="1" fill="#e2e8f0"/>
  <rect x="38" y="156" width="60" height="3" rx="1" fill="#e2e8f0"/>
  <rect x="38" y="166" width="40" height="3" rx="1" fill="#e2e8f0"/>
  <rect x="38" y="176" width="50" height="3" rx="1" fill="#e2e8f0"/>
  <text x="70" y="205" font-family="system-ui" font-size="9" fill="#64748b" text-anchor="middle">Page 1</text>

  <rect x="130" y="115" width="80" height="100" rx="4" fill="#ffffff" opacity="0.7"/>
  <rect x="138" y="125" width="55" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="138" y="132" width="60" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="138" y="139" width="40" height="3" rx="1" fill="#cbd5e1"/>
  <rect x="138" y="149" width="50" height="3" rx="1" fill="#e2e8f0"/>
  <rect x="138" y="156" width="55" height="3" rx="1" fill="#e2e8f0"/>
  <text x="170" y="205" font-family="system-ui" font-size="9" fill="#64748b" text-anchor="middle">Page 2</text>

  <!-- Sidebar search -->
  <rect x="20" y="230" width="200" height="32" rx="6" fill="#ffffff10"/>
  <text x="40" y="250" font-family="system-ui" font-size="11" fill="#64748b">Search in document...</text>

  <!-- Chat area -->
  <!-- User message 1 -->
  <rect x="420" y="65" width="350" height="48" rx="16" fill="#3b82f6"/>
  <text x="440" y="84" font-family="system-ui" font-size="13" fill="#ffffff">What are the key terms of this</text>
  <text x="440" y="100" font-family="system-ui" font-size="13" fill="#ffffff">contract?</text>

  <!-- AI message 1 -->
  <circle cx="270" y="148" r="14" fill="#e2e8f0"/>
  <text x="270" y="152" font-family="system-ui" font-size="11" fill="#64748b" text-anchor="middle">AI</text>

  <rect x="294" y="125" width="380" height="130" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="314" y="148" font-family="system-ui" font-size="13" fill="#334155" font-weight="600">Key Contract Terms:</text>
  <circle cx="320" cy="170" r="4" fill="#22c55e"/>
  <text x="332" y="174" font-family="system-ui" font-size="12" fill="#475569">Duration: 24 months (p.3)</text>
  <circle cx="320" cy="192" r="4" fill="#22c55e"/>
  <text x="332" y="196" font-family="system-ui" font-size="12" fill="#475569">Value: $2.4M annual (p.5)</text>
  <circle cx="320" cy="214" r="4" fill="#22c55e"/>
  <text x="332" y="218" font-family="system-ui" font-size="12" fill="#475569">Termination: 90 days notice (p.12)</text>
  <circle cx="320" cy="236" r="4" fill="#22c55e"/>
  <text x="332" y="240" font-family="system-ui" font-size="12" fill="#475569">Renewal: Automatic unless notified</text>

  <!-- User message 2 -->
  <rect x="380" y="275" width="390" height="48" rx="16" fill="#3b82f6"/>
  <text x="400" y="294" font-family="system-ui" font-size="13" fill="#ffffff">Are there any liability limitations</text>
  <text x="400" y="310" font-family="system-ui" font-size="13" fill="#ffffff">I should be aware of?</text>

  <!-- AI message 2 (typing) -->
  <circle cx="270" y="358" r="14" fill="#e2e8f0"/>
  <text x="270" y="362" font-family="system-ui" font-size="11" fill="#64748b" text-anchor="middle">AI</text>

  <rect x="294" y="340" width="200" height="44" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="320" cy="362" r="4" fill="#3b82f6" opacity="0.9"/>
  <circle cx="336" cy="362" r="4" fill="#3b82f6" opacity="0.5"/>
