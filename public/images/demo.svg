<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f0f9ff"/>
    </linearGradient>
    <linearGradient id="sidebar" x1="0" y1="0" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Window frame -->
  <rect width="800" height="500" rx="12" fill="url(#bg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title bar -->
  <rect width="800" height="40" rx="12" fill="#f8fafc"/>
  <rect y="28" width="800" height="12" fill="#f8fafc"/>
  <line x1="0" y1="40" x2="800" y2="40" stroke="#e2e8f0" stroke-width="1"/>
  <circle cx="20" cy="20" r="5" fill="#ef4444"/>
  <circle cx="38" cy="20" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="20" r="5" fill="#22c55e"/>
  <text x="400" y="24" font-family="system-ui" font-size="12" fill="#94a3b8" text-anchor="middle">DocChat — contract_2026.pdf</text>

  <!-- Sidebar (PDF preview) -->
  <rect x="0" y="40" width="240" height="460" fill="url(#sidebar)"/>
  <rect x="0" y="488" width="240" height="12" rx="0" fill="#1e293b"/>

  <!-- PDF icon + filename -->
  <rect x="20" y="60" width="200" height="36" rx="6" fill="#ffffff10"/>
